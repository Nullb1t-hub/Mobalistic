name: Mobalistic AI Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 */8 * * *"

permissions:
  contents: write

concurrency:
  group: mobalistic-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run Mobalistic content engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Publishing enabled after user confirmed the Telegram channel settings.
          PUBLISH_ENABLED: 'true'
          MAX_POSTS_PER_RUN: "2"
          MAX_AGE_DAYS: "7"
        run: python -m src.mobalistic
      - name: Commit publication history
        if: success()
        run: |
          git config user.name "mobalistic-bot"
          git config user.email "mobalistic-bot@users.noreply.github.com"
          git add data/published.json
          if ! git diff --cached --quiet; then
            git commit -m "Update publication history [skip ci]"
            git push
          fi
      - name: Upload previews and generated cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobalistic-preview-${{ github.run_number }}
          path: data/drafts/
          if-no-files-found: ignore
          retention-days: 7
